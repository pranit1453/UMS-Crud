services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: ums_postgres
    restart: always
    environment:
      POSTGRES_DB: ums_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ums_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Flask Backend REST API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ums_backend
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ums_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend Nginx Dashboard Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ums_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
